<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Studio｜金鑰設置</title><link rel="icon" type="image/png" href="/assets/icon_favicon.png"><style>
@font-face{font-family:Replica;src:url('/assets/fonts/Replica-Bold.ttf')}@font-face{font-family:LineSeed;src:url('/assets/fonts/LINESeedTW_TTF.ttf')}*{box-sizing:border-box}body{margin:0;background:#0b1117;color:#fff;font-family:LineSeed,Arial}.top{height:82px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;background:#080c11;border-bottom:1px solid #2d3944}.top img{width:170px}.top a{color:#aab4bc;text-decoration:none}.main{width:min(1400px,92vw);margin:35px auto}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}h1{font-family:Replica;margin:0;font-size:28px}.heading p{margin:7px 0 0;color:#81909b}.add,.save,.remove{border:0;color:#fff;cursor:pointer;font:14px Replica}.add{padding:12px 18px;background:#34414c}.save{padding:14px 30px;background:#ff4655}.remove{padding:10px;background:#702932}.table{background:#111a22;border:1px solid #2d3944}.row{display:grid;grid-template-columns:1.1fr 1.5fr 1fr 1.25fr 80px;gap:12px;padding:14px;border-bottom:1px solid #26323c;align-items:end}.row.head{font-size:12px;color:#7f8d97;background:#0c1218}.row.head div{padding:0 8px}.row:last-child{border:0}label{display:none}input{width:100%;padding:11px;background:#080d12;border:1px solid #34414c;color:#fff;font:14px LineSeed}.status{min-height:22px;margin:18px 0;color:#ff7b85}.status.ok{color:#64e39c}.actions{display:flex;justify-content:flex-end;gap:10px}@media(max-width:900px){.row{grid-template-columns:1fr}.row.head{display:none}label{display:block;color:#7f8d97;font-size:11px;margin-bottom:5px}}
</style></head><body><header class="top"><img src="/assets/PulseStudio_Logo_W.png"><a id="back">← 返回管理中心</a></header><main class="main"><div class="heading"><div><h1>金鑰設置</h1><p>管理所有賽事密鑰、UID、單位名稱與精確到秒的到期時間。</p></div><button class="add" id="add">＋ 新增金鑰</button></div><div class="table"><div class="row head"><div>密鑰</div><div>UID</div><div>單位名稱</div><div>到期日期（YYYY/MM/DD HH:MM:SS）</div><div>操作</div></div><div id="rows"></div></div><div id="status" class="status"></div><div class="actions"><button class="save" id="save">儲存所有變更</button></div></main><script>
const uid=decodeURIComponent(location.pathname.split('/').pop()),rows=document.getElementById('rows'),status=document.getElementById('status');document.getElementById('back').href=`/admin-home/${encodeURIComponent(uid)}`;
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function randomKey(length=16){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',bytes=new Uint8Array(length),result=[];while(result.length<length){crypto.getRandomValues(bytes);for(const byte of bytes){if(byte<248)result.push(chars[byte%chars.length]);if(result.length===length)break}}return result.join('')}
function randomUid(){return crypto.randomUUID()}
function endOfToday(){const now=new Date(),pad=value=>String(value).padStart(2,'0');return `${now.getFullYear()}-- 23:59:59`}
function addRow(item={}){const row=document.createElement('div');row.className='row';row.innerHTML=`<div><label>密鑰</label><input class="key" value="${escapeHtml(item.key)}" maxlength="64"></div><div><label>UID</label><input class="uid" value="${escapeHtml(item.uid)}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div><div><label>單位名稱</label><input class="name" value="${escapeHtml(item.name)}" maxlength="100"></div><div><label>到期日期</label><input class="expiry" value="${escapeHtml(item.expiry)}" placeholder="YYYY-MM-DD HH:MM:SS"></div><button class="remove">刪除</button>`;row.querySelector('.remove').onclick=()=>row.remove();rows.appendChild(row)}
async function load(){const response=await fetch(`/api/keys/${encodeURIComponent(uid)}`),result=await response.json();if(!response.ok){location.replace('/?reason=expired');return}rows.replaceChildren();result.data.forEach(addRow)}document.getElementById('add').onclick=()=>addRow({key:randomKey(),uid:randomUid(),name:'',expiry:endOfToday()});document.getElementById('save').onclick=async()=>{const keys=[...rows.querySelectorAll('.row')].map(row=>({key:row.querySelector('.key').value.trim(),uid:row.querySelector('.uid').value.trim(),name:row.querySelector('.name').value.trim(),expiry:row.querySelector('.expiry').value.trim().replace(/\//g,'-')}));status.className='status';status.textContent='正在儲存…';const response=await fetch(`/api/keys/${encodeURIComponent(uid)}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({keys})}),result=await response.json();status.textContent=result.success?'金鑰資料已成功儲存。':result.message;status.classList.toggle('ok',result.success)};load().catch(()=>{status.textContent='無法讀取金鑰資料'});
</script></body></html>
