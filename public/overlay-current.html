<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>Map Veto Current Action</title><script src="/socket.io/socket.io.js"></script><style>@font-face{font-family:Replica;src:url('/assets/fonts/Replica-Bold.ttf')}@font-face{font-family:Gridnik;src:url('/assets/fonts/FoundryGridnik-ExtraBold.ttf')}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;color:white}.stage{position:absolute;left:240px;right:240px;bottom:90px;height:250px;background:linear-gradient(110deg,#0f1923ee,#203440ee);border-top:5px solid var(--accent,#d4ff00);display:grid;grid-template-columns:290px 1fr 290px;align-items:center;padding:26px 40px;box-shadow:0 20px 80px #000b;clip-path:polygon(0 0,98% 0,100% 14%,100% 100%,2% 100%,0 86%);font-family:Replica}.team{text-align:center}.logo{width:105px;height:105px;object-fit:contain;display:block;margin:auto}.name{font-size:28px;margin-top:10px}.center{text-align:center}.event{font:22px Gridnik;color:#aab7c1;letter-spacing:2px}.action{font:54px Gridnik;margin:18px 0;color:var(--accent,#d4ff00)}.detail{font-size:27px}.status{font-size:17px;color:#98a7b1;margin-top:12px}.pulse{animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{filter:brightness(1.5);transform:scale(1.02)}}</style></head><body><main class="stage" id="stage"><div class="team"><img id="logoA" class="logo"><div id="teamA" class="name"></div></div><div class="center"><div id="event" class="event"></div><div id="action" class="action pulse">等待 BP</div><div id="detail" class="detail"></div><div id="status" class="status"></div></div><div class="team"><img id="logoB" class="logo"><div id="teamB" class="name"></div></div></main><script>const token=decodeURIComponent(location.pathname.split('/').pop()),socket=io(),$=id=>document.getElementById(id),randomLabel=value=>value==='Random'?'隨機':value;function render(s){$('stage').style.setProperty('--accent',s.themeColor||'#d4ff00');$('teamA').textContent=s.teamA||'TEAM A';$('teamB').textContent=s.teamB||'TEAM B';$('logoA').src=s.logoA||'/branding/valorant-icon.png';$('logoB').src=s.logoB||'/branding/valorant-icon.png';$('event').textContent=s.eventName||'MAP VETO';const last=s.maps?.at(-1);if(s.status==='WAITING_FOR_SIDE_SELECTION'&&last){$('action').textContent='選邊中';$('detail').textContent=`${last.mapNameZh||last.mapName} · ${randomLabel(s.pendingSideSelector||last.sideSelector)||'等待指定隊伍'}`}else if(s.status==='COMPLETED'){$('action').textContent='BP 完成';$('detail').textContent='FINAL MAP VETO RESULT'}else{$('action').textContent=`STEP ${Number(s.currentStep||0)+1}`;$('detail').textContent=s.currentActor?`${s.currentActor==='TEAM_A'?s.teamA:s.currentActor==='TEAM_B'?s.teamB:'隨機'} · ${s.currentAction==='BAN'?'禁用':s.currentAction==='PICK'?'選擇':'Decider'}`:'等待第一個操作'}$('status').textContent=s.status||''}fetch('/api/public/overlay/'+encodeURIComponent(token)).then(r=>r.json()).then(render);socket.on('connect',()=>socket.emit('join_room',token));socket.on('state_changed',render)</script></body></html>
