<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="description" content="適用於《特戰英豪》的電競賽事地圖 Ban/Pick 系統">
  <link rel="canonical" href="http://localhost:3000/">
  <meta name="theme-color" content="#5865F2">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PulseVeto">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:title" content="PulseVeto丨Powered by Pulse Studio">
  <meta property="og:description" content="適用於《特戰英豪》的電競賽事地圖 Ban/Pick 系統">
  <meta property="og:url" content="http://localhost:3000/">
  <meta property="og:image" content="http://localhost:3000/branding/PulseVeto_MainLogo.png">
  <meta property="og:image:alt" content="PulseVeto丨Powered by Pulse Studio">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PulseVeto丨Powered by Pulse Studio">
  <meta name="twitter:description" content="適用於《特戰英豪》的電競賽事地圖 Ban/Pick 系統">
  <meta name="twitter:image" content="http://localhost:3000/branding/PulseVeto_MainLogo.png">
  <meta name="twitter:image:alt" content="PulseVeto丨Powered by Pulse Studio">
  <link rel="icon" type="image/png" href="/branding/PulseVeto_Favicon.png">
  <link rel="apple-touch-icon" href="/branding/PulseVeto_MainIcon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/home.css?v=20260827-1">
  <link rel="stylesheet" href="/i18n.css?v=20260827-1">
</head>
<body>
  <main class="auth-shell">
    <section class="brand-panel" aria-labelledby="brand-heading">
      <div class="brand-panel__mesh" aria-hidden="true"></div>
      <header class="brand-lockup"><img src="/branding/PulseVeto_MainLogo.png" alt="PulseVeto" width="270" height="90"></header>
      <div class="brand-story">
        <div class="veto-stage" aria-hidden="true">
          <div class="stage-orbit stage-orbit--one"></div><div class="stage-orbit stage-orbit--two"></div>
          <img class="stage-icon" src="/branding/PulseVeto_MainIcon.png" alt="">
          <div class="veto-card veto-card--ban"><span data-card-label="ban">禁用</span><b>01</b></div>
          <div class="veto-card veto-card--pick"><span data-card-label="pick">選擇</span><b>02</b></div>
          <div class="veto-card veto-card--decider"><span data-card-label="decider">決勝</span><b>03</b></div>
          <div class="signal-dot signal-dot--one"></div><div class="signal-dot signal-dot--two"></div>
        </div>
        <div class="brand-copy">
          <h1 id="brand-heading" data-i18n="heroTitle">每一次選擇，
都決定比賽走向。</h1>
          <p data-i18n="heroBody">為《特戰英豪》電競賽事打造的即時 Ban／Pick、選邊與轉播協作系統。</p>
        </div>
      </div>
    </section>

    <section class="form-panel" aria-labelledby="login-heading">
      <div class="form-wrap">
        <div class="mobile-brand"><img src="/branding/PulseVeto_MainLogo.png" alt="PulseVeto"></div>
        <div class="form-heading">
          <p class="eyebrow" data-i18n="homeEyebrow">WELCOME TO PULSEVETO</p>
          <h2 id="login-heading" data-i18n="homeTitle">進入你的對戰</h2>
          <p data-i18n="homeSubtitle">輸入主辦單位提供的 8 位隊伍代碼，開始本場 Ban／Pick。</p>
        </div>
        <form id="teamForm" class="team-form">
          <label for="teamKey" data-i18n="teamCode">隊伍代碼</label>
          <div class="code-field">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3m-11 0h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/></svg>
            <input id="teamKey" name="teamKey" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="text" minlength="8" maxlength="8" pattern="[a-z2-9]{8}" placeholder="a7k9m2q4" aria-describedby="code-help" required>
          </div>
          <p id="code-help" class="field-help" data-i18n="teamCodeHelp">8 位小寫英數代碼</p>
          <button class="primary-action" type="submit"><span data-i18n="enterBp">進入 Ban／Pick</span><span aria-hidden="true">→</span></button>
          <div id="error" class="error" role="alert" aria-live="polite"></div>
        </form>
        <div class="divider"><span data-i18n="adminIdentity">或使用管理員身分</span></div>
        <button id="manager" class="discord-action" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.5 5.3A16.3 16.3 0 0 0 15.4 4l-.5 1a15 15 0 0 0-5.8 0l-.5-1a16.4 16.4 0 0 0-4.1 1.3C1.9 9.1 1.2 12.8 1.5 16.4a16.5 16.5 0 0 0 5 2.5l1.2-1.7a10.5 10.5 0 0 1-1.6-.8l.4-.3a11.7 11.7 0 0 0 11 0l.5.3c-.6.3-1.1.6-1.7.8l1.2 1.7a16.4 16.4 0 0 0 5-2.5c.4-4.2-.8-7.8-3-11.1ZM8.8 14.5c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.9.9 1.8 2c0 1.1-.8 2-1.8 2Zm6.4 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.9.9 1.8 2c0 1.1-.8 2-1.8 2Z"/></svg>
          <span data-i18n="discordLogin">Login via Discord</span>
        </button>
        <p class="powered">PulseVeto <span>·</span> Powered by Pulse Studio</p>
      </div>
    </section>
  </main>
  <script src="/i18n.js?v=20260830-1"></script><script src="/home-cards.js?v=20260830-1"></script><script src="/login.js?v=20260827-1"></script>
</body>
</html>
