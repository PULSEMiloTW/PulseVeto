<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>PulseVeto</title><!--TEAM_FAVICON--><link rel="stylesheet" href="/team-v2.css?v=20261003-2"><link rel="stylesheet" href="/team-enhancements.css?v=20261003-1"><link rel="stylesheet" href="/team-random-confirm.css?v=20260927-1"><link rel="stylesheet" href="/i18n.css?v=20260827-1"><script src="/socket.io/socket.io.js"></script></head>
<body class="team-v2"><main class="bp-stage"><header class="bp-head"><a href="/" class="bp-brand"><img src="/branding/PulseVeto_MainIcon.png" alt="PulseVeto"></a><div class="match-line"><div class="compact-team"><img id="logoA" alt=""><b id="nameA"></b></div><span>VS</span><div class="compact-team right"><b id="nameB"></b><img id="logoB" alt=""></div></div><div class="head-actions"><div id="teamLanguageSlot" class="language-slot"></div><button id="teamLogout" class="ghost" type="button">登出</button></div></header><section id="statusDeck" class="status-deck"><div><small id="eventName"></small><h1 id="current">載入 BP…</h1></div><div id="countdown" class="countdown">∞</div></section><section id="maps" class="map-board"></section></main>
<div id="intro" class="intro" hidden><div class="intro-arena"></div><div class="intro-slide"><div id="introStandard"><img id="introLogo" alt=""><p id="introKicker"></p><h2 id="introTitle"></h2></div><div id="introVersus" class="intro-versus" hidden><article><img id="introLogoA" alt=""><h2 id="introNameA"></h2></article><strong>VS</strong><article><img id="introLogoB" alt=""><h2 id="introNameB"></h2></article></div></div><div class="intro-mask" aria-hidden="true"></div></div>
<div id="readyModal" class="layer" hidden><div class="ready-card"><h2>雙方確認後開始 BP</h2><div class="ready-teams"><div id="readyA"></div><div id="readyB"></div></div><button id="readyButton" class="primary">確認準備完成</button><p>倒數會在兩支隊伍都確認後同步開始</p></div></div>
<div id="sideModal" class="layer" hidden><div class="dialog"><span>攻守選擇</span><h2 id="sideTitle"></h2><p id="sideContext"></p><div class="side-buttons"><button data-side="ATTACK">進攻方</button><button data-side="DEFENSE">防守方</button></div></div></div>
<div id="confirm" class="layer" hidden><div class="dialog"><h2 id="confirmTitle"></h2><div id="confirmPreview"></div><p>確認後無法自行撤銷。</p><div class="dialog-actions"><button id="cancel" class="ghost">取消</button><button id="submit" class="primary">確認送出</button></div></div></div>
<div id="randomModal" class="layer" hidden><div class="dialog"><span>隨機抽選結果</span><h2>請雙方確認抽選結果</h2><div id="randomResult"></div><p id="randomConfirmState"></p><button id="randomConfirm" class="primary">確認結果</button></div></div>
<div id="timeoutModal" class="layer timeout-layer" hidden><div class="timeout-card"><div class="timeout-spinner"></div><h2>操作時間已結束</h2><p id="timeoutMessage">正在等待系統抽選結果…</p></div></div>
<div id="completeModal" class="layer" hidden><div class="complete-card"><div class="complete-check" aria-hidden="true"><svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"><path d="M11 25l9 9 18-21"/></svg></div><h2>BP 已完成</h2><p id="completeMatch"></p><a id="resultLink" class="primary" href="#">前往 BP 結果頁</a></div></div>
<script src="/i18n.js?v=20260901-1"></script><script src="/team-v2.js?v=20261003-2"></script></body></html>
