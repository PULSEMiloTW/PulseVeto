<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Studio｜管理員入口</title><link rel="icon" type="image/png" href="/assets/icon_favicon.png"><style>
@font-face{font-family:Replica;src:url('/assets/fonts/Replica-Bold.ttf')}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#263440,#080c11 55%);color:#fff;font-family:Replica,Arial}.wrap{width:min(850px,90vw)}.brand{width:200px;margin-bottom:25px}h1{font-size:30px;margin:0 0 8px}.sub{color:#84919b;margin-bottom:30px;font-family:Arial}.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px}.choice{display:block;padding:36px;background:#111a22;border:1px solid #33404b;color:#fff;text-decoration:none;transition:.2s}.choice:hover{border-color:#ff4655;transform:translateY(-3px)}.num{color:#ff4655;font-size:13px;letter-spacing:2px}.choice h2{font-size:24px;margin:20px 0 10px}.choice p{font-family:Arial;color:#93a0aa;line-height:1.6;margin:0}.logout{display:inline-block;margin-top:25px;color:#9ca7af;text-decoration:none}@media(max-width:650px){.choices{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><img src="/assets/PulseStudio_Logo_W.png" class="brand"><h1>管理員控制中心</h1><div class="sub">請選擇要進入的管理功能</div><div class="choices"><a id="map" class="choice"><span class="num">01</span><h2>地圖設置</h2><p>設定隊伍、Logo、地圖流程與所有轉播 Overlay。</p></a><a id="keys" class="choice"><span class="num">02</span><h2>金鑰設置</h2><p>新增、修改或刪除所有賽事密鑰與授權期限。</p></a></div><a class="logout" href="/logout">← 登出</a></main><script>const uid=decodeURIComponent(location.pathname.split('/').pop());document.getElementById('map').href=`/admin/${encodeURIComponent(uid)}`;document.getElementById('keys').href=`/key-admin/${encodeURIComponent(uid)}`;</script></body></html>
